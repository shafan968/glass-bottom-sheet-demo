<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Bottom Sheet</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: white; font-family: system-ui, sans-serif; background: radial-gradient(circle at 20% 25%, #d477dc, transparent 30%), radial-gradient(circle at 80% 30%, #538fe9, transparent 35%), linear-gradient(145deg, #17172b, #263c63); }
    .orb { position: absolute; width: 260px; height: 260px; top: 24%; left: 18%; border-radius: 50%; background: linear-gradient(135deg, #f8a4d5, #7d75ee 60%, #65d8e8); box-shadow: 0 25px 90px #9a70ff66; }
    .orb.two { top: 35%; left: auto; right: 12%; width: 210px; height: 210px; background: linear-gradient(135deg, #ffe09a, #f4819c 55%, #8d68e8); }
    main { position: relative; z-index: 1; padding: 48px; }
    h1 { margin: 0; font-size: clamp(42px, 8vw, 76px); letter-spacing: -.06em; }
    p { color: #ffffffbd; }
    .sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 560px); padding: 24px 24px 34px; border: 1px solid #ffffff80; border-bottom: 0; border-radius: 34px 34px 0 0; background: #ffffff30; box-shadow: 0 -12px 60px #10162c55, inset 0 1px #ffffff90; backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); }
    .handle { width: 42px; height: 5px; margin: 0 auto 24px; border-radius: 8px; background: #ffffffa6; }
    .sheet h2 { margin: 0 0 8px; }
    .sheet p { margin: 0 0 20px; font-size: 14px; }
    button { width: 100%; padding: 17px; border: 1px solid #ffffffa6; border-radius: 999px; color: white; font-size: 16px; font-weight: 650; background: linear-gradient(120deg, #ffffff62, #ffffff20 55%, #ffffff44); box-shadow: inset 0 1px #ffffffd9, 0 8px 26px #15203c44; backdrop-filter: blur(18px); cursor: pointer; transition: .2s; }
    button:hover { transform: translateY(-2px); background-color: #ffffff30; }
    #message { min-height: 20px; text-align: center; color: #ffffffce; font-size: 13px; }
    @media (max-width: 600px) { main { padding: 36px 24px; } .orb { left: -8%; top: 26%; } .orb.two { right: -14%; top: 38%; } }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
  <main><p>LIQUID GLASS · DEMO</p><h1>Glass<br>Bottom Sheet</h1><p>轻盈的磨砂玻璃，映出背景的色彩。</p></main>
  <section class="sheet" aria-label="玻璃底部面板">
    <div class="handle" aria-hidden="true"></div>
    <h2>一触即发</h2><p>感受玻璃表面的模糊与高光效果。</p>
    <button id="glassButton" type="button">✦ &nbsp;体验玻璃效果</button>
    <p id="message" aria-live="polite"></p>
  </section>
  <script>
    document.querySelector('#glassButton').addEventListener('click', () => {
      document.querySelector('#message').textContent = '✨ 玻璃按钮已触发';
      setTimeout(() => document.querySelector('#message').textContent = '', 1800);
    });
  </script>
</body>
</html>
